name: Build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  macos-build:
    name: Build macOS (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Linux compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18 cmake build-essential curl git xz-utils bzip2 cpio
          llvm-config-18 --bindir >> "$GITHUB_PATH"
      - name: Cache OSXCross
        id: cross
        uses: actions/cache@v4
        with:
          path: .runtime/osxcross
          key: osxcross-llvm18-ubuntu24-27d21e49-sdk14.5-v2
      - name: Prepare OSXCross
        if: steps.cross.outputs.cache-hit != 'true'
        run: bash scripts/setup-macos-cross.sh
      - name: Test on Linux
        run: |
          go test ./...
          go vet ./...
          go test -tags "gui ci" ./internal/desktop ./cmd/foreverdubbed
      - name: Prepare macOS dependencies
        env:
          TARGET_ARCH: arm64
        run: |
          source scripts/macos-cross-env.sh "$TARGET_ARCH"
          go run ./tools/native -target darwin -arch "$TARGET_ARCH" -out ".runtime/native-darwin-$TARGET_ARCH"
          go run ./tools/models -out ".runtime/native-darwin-$TARGET_ARCH"
      - name: Install macOS signer
        if: github.event_name != 'pull_request'
        run: bash scripts/setup-macos-signing.sh --tools-only
      - name: Build signed macOS release
        if: github.event_name != 'pull_request'
        env:
          TARGET_ARCH: arm64
          SIGNING_PEM: ${{ secrets.FDB_MACOS_SIGNING_PEM }}
        run: |
          if [ -z "$SIGNING_PEM" ]; then
            echo 'Missing FDB_MACOS_SIGNING_PEM repository secret; see docs/macos.md.' >&2
            exit 1
          fi
          umask 077
          identity=$(mktemp "$RUNNER_TEMP/foreverdubbed-signing.XXXXXX.pem")
          trap 'rm -f "$identity"' EXIT
          printf '%s\n' "$SIGNING_PEM" > "$identity"
          unset SIGNING_PEM
          export FDB_MACOS_SIGNING_PEM="$identity"
          source scripts/macos-cross-env.sh "$TARGET_ARCH"
          go run ./tools/build -target darwin -arch "$TARGET_ARCH" -native-dir ".runtime/native-darwin-$TARGET_ARCH"
      - name: Build unsigned macOS test release
        if: github.event_name == 'pull_request'
        env:
          TARGET_ARCH: arm64
        run: |
          source scripts/macos-cross-env.sh "$TARGET_ARCH"
          go run ./tools/build -target darwin -arch "$TARGET_ARCH" -native-dir ".runtime/native-darwin-$TARGET_ARCH" -mac-unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-arm64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: dist/ForeverDubbed-darwin-arm64.zip
          if-no-files-found: error
          compression-level: 0

  windows-build:
    name: Build Windows (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Windows cross-compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git build-essential g++-mingw-w64-x86-64-posix
      - name: Prepare Windows dependencies
        run: |
          go run ./tools/native -target windows -arch amd64 -out .runtime/native-windows
          go run ./tools/models -out .runtime/native-windows
      - name: Build Windows release
        run: go run ./tools/build -target windows -arch amd64 -native-dir .runtime/native-windows
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: |
            dist/ForeverDubbed-windows-amd64.zip
            dist/ForeverDubbed-addon.zip
          if-no-files-found: error
          compression-level: 0

  macos-dmg:
    name: Package macOS DMG (arm64)
    needs: macos-build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-bundle-arm64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: incoming
      - name: Extract app, addon, and documentation
        env:
          TARGET_ARCH: arm64
        run: |
          mkdir -p staging dist
          ditto -x -k "incoming/ForeverDubbed-darwin-$TARGET_ARCH.zip" staging
          test -x staging/ForeverDubbed.app/Contents/MacOS/foreverdubbed
          ln -s /Applications staging/Applications
      - name: Verify signed app with Apple's tools
        if: github.event_name != 'pull_request'
        run: codesign --verify --deep --strict --verbose=2 staging/ForeverDubbed.app
      - name: Create and verify compressed disk image
        env:
          TARGET_ARCH: arm64
        run: |
          hdiutil create -volname ForeverDubbed -srcfolder staging -fs HFS+ -format UDZO "dist/ForeverDubbed-darwin-$TARGET_ARCH.dmg"
          hdiutil verify "dist/ForeverDubbed-darwin-$TARGET_ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: dist/ForeverDubbed-darwin-arm64.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [windows-build, macos-dmg]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.5.1.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: downloads
      - name: Check downloads and generate checksums
        working-directory: downloads
        run: |
          files=(
            ForeverDubbed-darwin-arm64.dmg
            ForeverDubbed-windows-amd64.zip
            ForeverDubbed-addon.zip
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Create release, attach downloads, and publish
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            ForeverDubbed-darwin-arm64.dmg \
            ForeverDubbed-windows-amd64.zip \
            ForeverDubbed-addon.zip \
            SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --verify-tag \
            --title "ForeverDubbed $RELEASE_TAG" \
            --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
