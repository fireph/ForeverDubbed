name: Build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
permissions:
  contents: read
jobs:
  macos-build:
    name: Build macOS (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: '1.27.1'
          # Both jobs run on Ubuntu; setup-go's default key omits the build target.
          cache: false
      - name: Cache Go modules and build outputs (macOS arm64)
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Refresh compiled packages per commit and restore only this target.
          key: go-v1-${{ runner.os }}-ubuntu24-${{ runner.arch }}-darwin-arm64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'native/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-ubuntu24-${{ runner.arch }}-darwin-arm64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'native/CMakeLists.txt') }}-
      - name: Linux compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18 cmake build-essential curl git xz-utils bzip2 cpio lua5.1
          llvm-config-18 --bindir >> "$GITHUB_PATH"
      - name: Cache OSXCross
        id: cross
        uses: actions/cache@v6
        with:
          path: .runtime/osxcross
          key: osxcross-llvm18-ubuntu24-27d21e49-sdk14.5-v2
      - name: Prepare OSXCross
        if: steps.cross.outputs.cache-hit != 'true'
        run: bash scripts/setup-macos-cross.sh
      - name: Test on Linux
        run: |
          go test ./...
          go vet ./...
          go test -tags "gui ci" ./internal/desktop ./cmd/foreverdubbed
      - name: Prepare macOS dependencies
        env:
          TARGET_ARCH: arm64
        run: |
          source scripts/macos-cross-env.sh "$TARGET_ARCH"
          go run ./tools/native -target darwin -arch "$TARGET_ARCH" -out ".runtime/native-darwin-$TARGET_ARCH"
          go run ./tools/models -out ".runtime/native-darwin-$TARGET_ARCH"
      - name: Install macOS signer
        if: github.event_name != 'pull_request'
        run: bash scripts/setup-macos-signing.sh --tools-only
      - name: Build signed macOS release
        if: github.event_name != 'pull_request'
        env:
          TARGET_ARCH: arm64
          SIGNING_PEM: ${{ secrets.FDB_MACOS_SIGNING_PEM }}
        run: |
          if [ -z "$SIGNING_PEM" ]; then
            echo 'Missing FDB_MACOS_SIGNING_PEM repository secret; see docs/macos.md.' >&2
            exit 1
          fi
          umask 077
          identity=$(mktemp "$RUNNER_TEMP/foreverdubbed-signing.XXXXXX.pem")
          trap 'rm -f "$identity"' EXIT
          printf '%s\n' "$SIGNING_PEM" > "$identity"
          unset SIGNING_PEM
          export FDB_MACOS_SIGNING_PEM="$identity"
          source scripts/macos-cross-env.sh "$TARGET_ARCH"
          go run ./tools/build -target darwin -arch "$TARGET_ARCH" -native-dir ".runtime/native-darwin-$TARGET_ARCH"
      - name: Build unsigned macOS test release
        if: github.event_name == 'pull_request'
        env:
          TARGET_ARCH: arm64
        run: |
          source scripts/macos-cross-env.sh "$TARGET_ARCH"
          go run ./tools/build -target darwin -arch "$TARGET_ARCH" -native-dir ".runtime/native-darwin-$TARGET_ARCH" -mac-unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: macos-bundle-arm64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: dist/ForeverDubbed-mac-arm64.zip
          if-no-files-found: error
          compression-level: 0

  windows-build:
    name: Build and sign Windows (amd64)
    runs-on: windows-2025
    # Only this environment is trusted by the Azure federated credential.
    environment: ${{ github.event_name == 'pull_request' && 'windows-testing' || 'windows-signing' }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      FDB_SIGNING_ENDPOINT: ${{ vars.FDB_SIGNING_ENDPOINT }}
      FDB_SIGNING_ACCOUNT: ${{ vars.FDB_SIGNING_ACCOUNT }}
      FDB_SIGNING_PROFILE: ${{ vars.FDB_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v7
      - name: Check signing configuration
        if: github.event_name != 'pull_request'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'FDB_SIGNING_ENDPOINT', 'FDB_SIGNING_ACCOUNT', 'FDB_SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing $name. Configure the windows-signing environment; see docs/windows-signing.md."
            }
          }
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
          # Reset cached cgo objects when the configured toolchain changes.
          cache-dependency-path: |
            go.mod
            go.sum
            .github/workflows/build.yml
            native/CMakeLists.txt
      - name: Install MinGW UCRT64 compiler and make
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          path-type: minimal
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
      - name: Configure native Windows build tools
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # Use native MinGW tools from PowerShell, without MSYS shell wrappers.
          $compilerBin = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "CC=$(Join-Path $compilerBin 'gcc.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=$(Join-Path $compilerBin 'g++.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Prepare Windows dependencies
        run: |
          go run ./tools/native -target windows -arch amd64 -out .runtime/native-windows
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency preparation failed' }
          go run ./tools/models -out .runtime/native-windows
          if ($LASTEXITCODE -ne 0) { throw 'Model preparation failed' }
      - name: Install Azure signing module
        if: github.event_name != 'pull_request'
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery
      - name: Azure login using GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build signed Windows release
        if: github.event_name != 'pull_request'
        run: go run ./tools/build -target windows -arch amd64 -native-dir .runtime/native-windows -windows-installer -windows-sign
      - name: Build unsigned Windows test release
        if: github.event_name == 'pull_request'
        run: go run ./tools/build -target windows -arch amd64 -native-dir .runtime/native-windows -windows-installer
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: |
            dist/ForeverDubbed-windows-amd64-setup.exe
            dist/ForeverDubbed-windows-amd64-portable.zip
            dist/ForeverDubbed-addon.zip
          if-no-files-found: error
          compression-level: 0

  macos-dmg:
    name: Package macOS DMG (arm64)
    needs: macos-build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-bundle-arm64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: incoming
      - name: Extract app, addon, and documentation
        env:
          TARGET_ARCH: arm64
        run: |
          mkdir -p staging dist
          ditto -x -k "incoming/ForeverDubbed-mac-$TARGET_ARCH.zip" staging
          test -x staging/ForeverDubbed.app/Contents/MacOS/foreverdubbed
          ln -s /Applications staging/Applications
          cp "incoming/ForeverDubbed-mac-$TARGET_ARCH.zip" dist/
      - name: Verify signed app with Apple's tools
        if: github.event_name != 'pull_request'
        run: codesign --verify --deep --strict --verbose=2 staging/ForeverDubbed.app
      - name: Create and verify compressed disk image
        env:
          TARGET_ARCH: arm64
        run: |
          # hdiutil can fail transiently with EBUSY even on an isolated runner.
          # Fresh paths prevent a partial image from poisoning the next attempt.
          export LC_ALL=C
          dmg_work=$(mktemp -d "$RUNNER_TEMP/foreverdubbed-dmg.XXXXXX")
          trap 'rm -rf "$dmg_work"' EXIT
          for attempt in 1 2 3 4 5; do
            image="$dmg_work/attempt-$attempt.dmg"
            log="$dmg_work/create.log"
            if hdiutil create -volname ForeverDubbed -srcfolder staging -fs HFS+ -format UDZO "$image" >"$log" 2>&1; then
              cat "$log"
              hdiutil verify "$image"
              mv "$image" "dist/ForeverDubbed-mac-$TARGET_ARCH.dmg"
              exit 0
            else
              status=$?
            fi
            cat "$log" >&2
            if ! grep -Fqi 'Resource busy' "$log" || [ "$attempt" -eq 5 ]; then
              exit "$status"
            fi
            delay=$((attempt * 5))
            echo "DMG creation is busy (attempt $attempt/5); retrying in $delay seconds." >&2
            sleep "$delay"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-mac-arm64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: |
            dist/ForeverDubbed-mac-arm64.dmg
            dist/ForeverDubbed-mac-arm64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [windows-build, macos-dmg]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.5.1.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: downloads
      - name: Check downloads and generate checksums
        working-directory: downloads
        run: |
          files=(
            ForeverDubbed-mac-arm64.dmg
            ForeverDubbed-mac-arm64.zip
            ForeverDubbed-windows-amd64-setup.exe
            ForeverDubbed-windows-amd64-portable.zip
            ForeverDubbed-addon.zip
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
        # History is direct commits rather than merged PRs; commit mode also
        # covers any future PRs squash-merged without merge commits.
      - name: Build changelog since previous release
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v6.3.0
        with:
          mode: COMMIT
          failOnError: true
          outputFile: downloads/CHANGELOG.md
      - name: Create release, attach downloads, and publish
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            ForeverDubbed-mac-arm64.dmg \
            ForeverDubbed-mac-arm64.zip \
            ForeverDubbed-windows-amd64-setup.exe \
            ForeverDubbed-windows-amd64-portable.zip \
            ForeverDubbed-addon.zip \
            SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --verify-tag \
            --title "ForeverDubbed $RELEASE_TAG" \
            --notes-file CHANGELOG.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
